name: Build FlowOS APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK Licenses and Ensure SDK 35
        run: |
          SDK_MGR=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          if [ -n "$SDK_MGR" ]; then
            yes | "$SDK_MGR" --licenses >/dev/null 2>&1 || true
            "$SDK_MGR" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          fi

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Unpack FlowOS source archive if present
        run: |
          if [ -f FlowOS-source.zip ]; then
            unzip -o FlowOS-source.zip || true
          fi

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload FlowOS APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlowOS-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
